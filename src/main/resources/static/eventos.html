<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Eventos - IF Eventos</title>
  <link rel="stylesheet" href="style.css">
  <script type="module" src="js/eventos.js"></script>
</head>
<body>
  <header><div class="conteudo">
    <h1>IF Eventos</h1><p>Gestão de usuários, eventos e inscrições</p>
    <nav aria-label="Navegação principal">
      <a href="index.html">Início</a><a href="usuarios.html">Usuários</a>
      <a href="eventos.html" aria-current="page">Eventos</a><a href="inscricoes.html">Inscrições</a>
    </nav>
  </div></header>
  <main class="conteudo">
    <p id="mensagem" class="mensagem" role="status" aria-live="polite"></p>
    <section class="painel">
      <h2 id="tituloFormulario">Cadastrar evento</h2>
      <form id="formEvento">
        <label>Título<input name="titulo" required maxlength="120" placeholder="Ex.: Oficina de APIs REST"></label>
        <label>Descrição<textarea name="descricao" rows="2" maxlength="500"></textarea></label>
        <div class="duas-colunas">
          <label>Data<input name="data" type="date" required></label>
          <label>Capacidade<input name="capacidade" type="number" min="1" required value="10"></label>
        </div>
        <label>Local<input name="local" required placeholder="Lab 2"></label>
        <div class="acoes">
          <button type="submit" id="salvarEvento">Cadastrar evento</button>
          <button type="button" class="botao-secundario" id="cancelarEdicao" hidden>Cancelar edição</button>
        </div>
      </form>
    </section>
    <section class="painel">
      <div class="secao-titulo">
        <div><h2>Eventos disponíveis</h2><p>Consulte as vagas e exporte os participantes em JSON ou XML.</p></div>
        <button class="botao-secundario" id="atualizar" type="button">Atualizar</button>
      </div>
      <div id="listaEventos" class="cartoes"></div>
    </section>
  </main>
</body>
</html>
